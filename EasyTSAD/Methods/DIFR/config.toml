# Defaults copied verbatim from the approved reproduction contract.
# Long string values are fixed algorithm descriptions in that contract.
[Data_Params]
preprocess = "raw"

[Model_Params.Default]
window_size = 100
train_stride = 10
test_stride = 1
representation_preprocess = "For each independent network, collect all window representations in one fit or inference call, independently standardize each output feature with sklearn StandardScaler.fit_transform (population variance; zero-variance features use scale 1), then apply elementwise tanh. Inference fits its own representation scaler over the test-window collection; no stored training scaler is reused."
network_name = "dilated_conv"
data_type = "ts"
n_ensemble = 50
n_estimators = 6
max_samples = 256
layers = 2
hidden_dim = 32
rep_dim = 20
kernel_size = 3
dilation_base = 2
activation = "gelu"
pooling = "max"
dropout = 0
init_distribution = "normal"
init_mean = 0
init_std = 1
ensemble_method = "independent"
batch_size = 64
random_state = 42
score_function = "Paper DEAS over the complete forest T of n_ensemble*n_estimators trees: s(o)=2^(-mean_tau h_tau(o)/c(m))*mean_tau g_tau(o), where m=min(max_samples,number_of_training_windows), h_tau is the traversed edge count, and g_tau is the mean absolute distance to the thresholds at the visited internal split nodes. Higher is more anomalous. Compute both means globally before multiplying; do not average nonlinear per-representation scores."
device = "cuda when available, otherwise cpu; device choice changes execution placement only"
n_processes = 1
