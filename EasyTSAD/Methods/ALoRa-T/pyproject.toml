[project]
name = "tsad-env-alora"
version = "0.0.0"
requires-python = "==3.11.*"
dependencies = ["easytsad", "numpy<2", "scipy", "torch==2.6.0", "statsmodels"]

[tool.uv]
package = false

[tool.uv.sources]
easytsad = { path = "../../..", editable = true }
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
