      ann_backend: 'auto' prefers hnswlib and falls back to scikit-learn
      (EasyTSAD/Methods/HYDRA/upstream/HYDRA/models/HNSW_index.py:33-38). The two
      backends return slightly different approximate neighbours, so level
      representatives and therefore scores can differ numerically between runs of
