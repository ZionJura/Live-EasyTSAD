      (EasyTSAD/Methods/HYDRA/paper/paper.md:1296-1298) while the shipped script
      hardcodes 64 (EasyTSAD/Methods/HYDRA/upstream/HYDRA/main.py:58). The
      EasyTSAD run must state which of the two it uses; both are legitimate HYDRA
      settings, so this is a configuration choice, not an interface change.
    - >-
      hyperparameters_artifact: EasyTSAD/Methods/HYDRA/reproduction/hyperparameters.json
      was not readable from this worker (tool error), so the win_size / K / stride
      / ANN defaults recorded above come from the source code and the paper.
      IMPLEMENT should reconcile with the hyperparameter artifact once it is
      available.
    - >-
      short_series: When T < win_size or num_win == 1 the pipeline degenerates (a
      single window yields level-0 score 0,
      EasyTSAD/Methods/HYDRA/upstream/HYDRA/models/HYDRA_approx.py:270-271, and
      tree_compress stops immediately). Series shorter than win_size cannot be
      scored, so the adapter should raise rather than pad.
