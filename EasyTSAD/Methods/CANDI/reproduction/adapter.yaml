  - "EasyTSAD/Methods/CANDI/upstream/main.py:8-39 — entrypoint order: config -> devices -> seeds -> model -> trainer.train() -> load_best_model() -> Predictor.predict()"
  - "EasyTSAD/Methods/CANDI/upstream/utils/parser.py:13-68 — parse_args/load_config, dataset-name-driven N_VAR (SMD=38, SWaT=51), checkpoint and result dirs"
  - "EasyTSAD/Methods/CANDI/upstream/config.py:26-32,39,61,70,74-79,89,105-107,122 — WIN_SIZE=10, TRAIN_STEP=TEST_STEP=1, SCALE='standard', TRAIN_RATIO=0.8, TEST.TTA.ENABLE=True, TTA.METHOD='CANDI', THRESHOLD ratio 0.5, MODEL.NAME='MLP'"
  - "EasyTSAD/Methods/CANDI/upstream/datasets/build.py:12-26,49-59,61-73,83-104 — per-split arrays, train/val split by TRAIN_RATIO, StandardScaler fit on train only, window count and (index*step, index*step+win_size) slicing"
  - "EasyTSAD/Methods/CANDI/upstream/datasets/build.py:188-200 — build_dataset only maps SMD and SWaT, so no univariate loader exists"
  - "EasyTSAD/Methods/CANDI/upstream/models/mlp/modeling_mlp.py:23-25,38-53 — forward asserts L==WIN_SIZE and C==N_VAR; get_anomaly_scores reduces MSE with mean over time and channel dims"
  - "EasyTSAD/Methods/CANDI/upstream/models/timesnet/modeling_timesnet.py:117-136 — same score reduction for the TimesNet variant"
  - "EasyTSAD/Methods/CANDI/upstream/predictor.py:33-49,102-128,131-138 — score collection, flattening, length assertion against labels, Thresholder construction, TTA loop"
  - "EasyTSAD/Methods/CANDI/upstream/trainer.py:275-314 — load_best_model checkpoint restore, build_trainer model dispatch, prepare_inputs unconditional cuda"
  - "EasyTSAD/Methods/CANDI/upstream/tta/adapter.py and upstream/tta/candi/adapter_candi.py:107-149,163-285 — SANA in/out modules, FPM hard/moderate sample curation, MIN_SAMPLES-gated adaptation steps"
  - "EasyTSAD/Methods/__init__.py:20-120 — BaseMethod hooks train_valid_phase / train_valid_phase_all_in_one / test_phase / anomaly_score / get_y_hat / param_statistic"
  - "EasyTSAD/Evaluations/Performance.py:30-43 — 1-D np.ndarray score requirement, score length must not exceed label length, labels truncated to their last len(scores) entries, scores shifted by min()"
  - "EasyTSAD/DataFactory/MTSData.py:38-119 — MTSData attributes, min_max_norm and z_score_norm fit per feature on train only"
  - "EasyTSAD/Controller/TSADController.py:239-258 — evaluator loads saved scores and pairs them with the untouched test_label"
  - "EasyTSAD/Methods/CANDI/reproduction/source.json — vendored commit 28c9679e503832f59e351208cde63657fcb51cad, paper arXiv:2604.01845"

unresolved:
  - "Upstream's internal Thresholder (ratio / best_f1) and its window-level 'any anomaly' label (upstream/datasets/build.py:104, upstream/predictor.py:131-138) are intentionally NOT ported; EasyTSAD's evaluator owns thresholding and metrics, so reported operating points will differ from the paper's ratio-based table."
  - "FPM top-k/Q1-Q3 sample selection is driven by cfg.TEST.THRESHOLD.ANOMALY_RATIO (upstream/tta/candi/adapter_candi.py:136-149) even though the threshold itself is not exported; IMPLEMENT must keep that hyperparameter as the curation ratio, not as a decision threshold."
  - "Official configs pin N_VAR per dataset name; the EasyTSAD adapter must derive it from the curve width, so no source line covers arbitrary C."
  - "Upstream saves val representations and npy result dumps under cfg.RESULT_DIR (upstream/predictor.py:86-94, upstream/tta/candi/adapter_candi.py:126-129); EasyTSAD writes scores through PathManager instead, so those side effects are dropped."
  - "Reporting-only diagnostic (clone): git clone of https://github.com/kimanki/CANDI.git failed with HTTP 407 through the proxy (EasyTSAD/Harness/tasks/CANDI/journal.jsonl); the repository is already vendored at EasyTSAD/Methods/CANDI/upstream, so the mapping above is derived from the local checkout."
  - "Reporting-only diagnostic (environment): the environment branch's uv install failed on yacs==0.1.8 with 'Disk quota exceeded (os error 122)' while hardlinking from runtime/uv-cache (EasyTSAD/Harness/tasks/CANDI/journal.jsonl). This is an environment/provisioning concern, not an interface one; it does not change the input, score, alignment or compute_device mapping above, but a CUDA-capable torch install must exist before IMPLEMENT can run. Ownership: controller (installation)."
