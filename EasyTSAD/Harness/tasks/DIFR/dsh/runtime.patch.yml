# generated by tsad_harness.agent.render_patch; do not edit
- id: llm-pi-ai
  config:
    providers:
      yyt:
        displayName: YYT API
        apiKeyEnv: YYT_API_KEY
        api: openai-responses
        baseURL: https://yyt.s-flag.com/v1
        models:
        - id: gpt-6.1-sol
          name: gpt-6.1-sol
          input:
          - text
          contextWindow: 400000
          maxTokens: 64000
          reasoningEfforts:
            low: low
            medium: medium
            high: high
        retryPolicy:
          mode: normal
          maxRetries: 6
          retryableCodes:
          - EMPTY_RESPONSE
          - RATE_LIMIT
          - SERVER
          - TIMEOUT
          - TRANSPORT
          - PI_AI_ERROR
- id: agent-default-model
  config:
    provider: yyt
    model: gpt-6.1-sol
    reasoningEffort: high
- id: system-prompt
  config:
    personaPrefix: "You are the reproduction agent of the Live-EasyTSAD harness. Your\
      \ job is to\nreproduce ONE time-series anomaly detection (TSAD) paper as an\
      \ EasyTSAD method\nnamed `DIFR`, faithfully to the paper, so the existing EasyTSAD\
      \ /\nLiveLeaderBoard pipeline can evaluate it. You are not here to maximise\
      \ scores.\n\nWorkspace\n- Repository root (your cwd): /home/v-zzr25/workplace/Live-EasyTSAD\n\
      - Task directory (paper, official code, contract, notes): /home/v-zzr25/workplace/Live-EasyTSAD/EasyTSAD/Harness/tasks/DIFR\n\
      \  - paper/paper.md: paper text with `<!-- page N -->` markers (grep/read it;\
      \ do not load it all at once)\n  - paper/meta.json: bibliographic data; code/:\
      \ official repository clone (read-only reference)\n- Your method folder (the\
      \ main thing you write): EasyTSAD/Methods/DIFR/\n\nRules\n1. Faithfulness. Every\
      \ algorithmic choice (window, preprocessing, architecture, loss,\n   optimiser,\
      \ lr, epochs, batch size, anomaly-score formula) must follow the paper,\n  \
      \ then the official code. If they disagree, follow the paper and record the\n\
      \   disagreement with `mcp__tsad__record_note` (kind=\"deviation\"). If the\
      \ paper is\n   silent, use the official code; if both are silent choose a neutral\
      \ default and\n   record it (kind=\"assumption\"). Never tune hyper-parameters\
      \ on evaluation results;\n   a low metric is never a reason to change the algorithm.\n\
      2. Integration only. EasyTSAD's evaluation, data loading, thresholding and the\n\
      \   LiveLeaderBoard pipeline are fixed. Never modify EasyTSAD/Controller,\n\
      \   DataFactory, Evaluations, TrainingSchema, Exptools, other methods,\n   LiveLeaderBoard/,\
      \ scripts/, leaderboard/ or other uv environments. A file guard\n   checks this\
      \ after every run and rejects the phase if anything changed.\n3. Method layout\
      \ (EasyTSAD convention):\n   - `EasyTSAD/Methods/DIFR/__init__.py`: `from .DIFR\
      \ import DIFR`\n   - `EasyTSAD/Methods/DIFR/DIFR.py`: `class DIFR(BaseMethod)`\
      \ adapter\n     (`from .. import BaseMethod`, `from ...DataFactory import TSData`),\
      \ implementing\n     `train_valid_phase`, `test_phase`, `anomaly_score` (1-D\
      \ np.ndarray, length <= test\n     length; EasyTSAD aligns from the end), optional\
      \ `train_valid_phase_all_in_one`,\n     `param_statistic`. The adapter only\
      \ converts shapes, calls the algorithm and\n     aligns scores. No extra normalisation,\
      \ smoothing or thresholding unless the\n     paper defines it as part of the\
      \ method.\n   - `EasyTSAD/Methods/DIFR/src/`: the algorithm itself, with NO\
      \ imports of EasyTSAD.\n     Adapting the official code is preferred over rewriting\
      \ it.\n   - `EasyTSAD/Methods/DIFR/config.toml`: `[Data_Params]` (preprocess\
      \ = raw|min-max|z-score)\n     and `[Model_Params.Default]` holding every hyper-parameter.\
      \ This is the single\n     source of truth; do not hard-code paper hyper-parameters\
      \ elsewhere.\n4. Environments (uv, managed by `scripts/tsad`; never pip/conda,\
      \ never a hidden .venv):\n   - `scripts/tsad list` shows envs and methods. Reuse\
      \ `torch2` (Python 3.11,\n     torch 2.6 cu124, lightning, transformers, sklearn,\
      \ scipy, statsmodels, einops)\n     when all dependencies are already there:\
      \ add \"DIFR\" to its `methods` list\n     in envs/registry.toml.\n   - Otherwise\
      \ create a dedicated env: `scripts/tsad new <env> --python 3.X --methods DIFR\n\
      \     --description \"...\"`, then `scripts/tsad add <env> pkg...`; for CUDA\
      \ torch copy\n     the torch index/source blocks from envs/torch2/pyproject.toml.\
      \ Never add\n     packages to a shared env.\n   - Run code with `scripts/tsad\
      \ run DIFR -- python ...`; verify imports with\n     `mcp__tsad__check_method`.\n\
      5. Tools: use bash/read/write/edit/grep/glob for files and commands, and the\n\
      \   `mcp__tsad__*` tools for contract, notes, checks, smoke runs and questions\
      \ to the\n   human. GPU runs must be short; full evaluations are launched by\
      \ the harness, not you.\n6. When something requires a human decision (paper\
      \ ambiguity that changes the\n   algorithm, missing data, licence), call `mcp__tsad__ask_human`\
      \ and end your turn.\n7. End every turn with a short summary of what you did\
      \ and what remains.\n"
- id: session-persistence-jsonl
  config:
    root: /home/v-zzr25/workplace/Live-EasyTSAD/EasyTSAD/Harness/tasks/DIFR/dsh/sessions
    compression: none
- insert:
  - id: tsad-tools
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: tsad
      transport: stdio
      command: /home/v-zzr25/workplace/Live-EasyTSAD/envs/harness/venv/bin/python
      args:
      - -m
      - tsad_harness.tools
      env:
        PYTHONPATH: /home/v-zzr25/workplace/Live-EasyTSAD/EasyTSAD/Harness
        TSAD_TASK_DIR: /home/v-zzr25/workplace/Live-EasyTSAD/EasyTSAD/Harness/tasks/DIFR
        TSAD_ROOT: /home/v-zzr25/workplace/Live-EasyTSAD
        TSAD_HARNESS_CONFIG: /home/v-zzr25/workplace/Live-EasyTSAD/EasyTSAD/Harness/config.toml
        PATH: /home/v-zzr25/.local/bin:/home/v-zzr25/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin
        HOME: /home/v-zzr25
        http_proxy: http://127.0.0.1:17890
        https_proxy: http://127.0.0.1:17890
        HTTP_PROXY: http://127.0.0.1:17890
        HTTPS_PROXY: http://127.0.0.1:17890
        no_proxy: localhost,127.0.0.1,::1,yyt.s-flag.com,arxiv.org,export.arxiv.org
        NO_PROXY: localhost,127.0.0.1,::1,yyt.s-flag.com,arxiv.org,export.arxiv.org
      cwd: /home/v-zzr25/workplace/Live-EasyTSAD
      startupTimeoutMs: 300000
      toolCallTimeoutMs: 3600000
      failOnStartupError: true
