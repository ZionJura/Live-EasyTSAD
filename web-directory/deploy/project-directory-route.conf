# Public project index. Destination projects retain their existing access controls.
location = /projects { return 302 /projects/; }
location = /projects/projects.json {
    alias /var/www/project-directory/data/projects.json;
    default_type application/json;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff;
}
location ^~ /projects/ {
    alias /var/www/project-directory/current/static/;
    index index.html;
    autoindex off;
    charset utf-8;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
}
