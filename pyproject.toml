# Core EasyTSAD library.
#
# Only lightweight, method-agnostic dependencies belong here. Heavy or
# method-specific dependencies (torch, tslearn, ...) are declared in the
# per-environment projects under `envs/`. See "Environment Management" in
# README.md.

[project]
name = "EasyTSAD"
version = "0.3.0.2"
description = "A Suite for TimeSeries Anomaly Detection Benchmark"
authors = [{ name = "HT Si", email = "htsi@cnic.cn" }]
license = { text = "GPL-3.0" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "toml>=0.10.2",
    "numpy>=1.21",
    "matplotlib>=3.5",
    "tqdm>=4.60",
    "scikit-learn>=0.23",
    "pandas>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["EasyTSAD"]

[tool.uv]
# The repository root is NOT a uv-managed environment. Always work through
# `scripts/tsad` (or `uv ... --project envs/<name>`), never `uv sync` here.
managed = false
