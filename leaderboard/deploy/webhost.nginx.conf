# Static production build, served on a dedicated loopback port.
server {
    listen 127.0.0.1:8766;
    server_name localhost;
    root /var/www/liveadboard/current;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/liveadboard.access.log main;
    error_log /var/log/nginx/liveadboard.error.log warn;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}

# Install as zzz-liveadboard.conf so the existing default virtual host is retained.
server {
    listen 80;
    listen [::]:80;
    server_name 49.232.30.3;
    server_tokens off;

    include /etc/nginx/snippets/liveadboard-route.conf;
    include /etc/nginx/snippets/project-directory-route*.conf;

    # Preserve the IP host's existing redirect outside the leaderboard path.
    location / {
        return 301 https://$host$request_uri;
    }
}
