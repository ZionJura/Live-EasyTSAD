# Environment: torch2
# Default environment for PyTorch-based and classic methods.
# Python 3.11 + PyTorch 2.6 (CUDA 12.4 wheels, works with NVIDIA driver >= 550).

[project]
name = "tsad-env-torch2"
version = "0.0.0"
requires-python = "==3.11.*"
dependencies = [
    "easytsad",
    "numpy<2",                 # several methods rely on NumPy 1.x behaviour
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchinfo",
    "pytorch-lightning",
    "torchmetrics",
    "torch-optimizer",
    "einops",
    "transformers",            # OFA (GPT-2 backbone)
    "scipy",
    "statsmodels",
    "stumpy",
]

[tool.uv]
package = false

[tool.uv.sources]
easytsad = { path = "../..", editable = true }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
