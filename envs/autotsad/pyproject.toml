# Environment: autotsad
# AutoTSAD official deps (numpy<1.24, pandas<2, scikit-learn==1.2.0, optuna, timeeval, stumpy, pyod, pywavelets, pythresh, networkx, pynisher).

[project]
name = "tsad-env-autotsad"
version = "0.0.0"
requires-python = "==3.9.*"
dependencies = [
    "easytsad",
    # add the method-specific dependencies here
    "jdk4py==17.0.9.2",
    "joblib>=1.2",
    "matplotlib>=3.6",
    "networkx==3.1",
    "numba>=0.58",
    "numpy>=1.23,<1.24",
    "nx-config==0.2.0b5",
    "optuna==3.2",
    "pandas>=1.4,<2",
    "periodicity-detection>=0.1.2",
    "plotly>=5.9",
    "pynisher>=1.0.5",
    "pyod>=0.9.2",
    "pywavelets>=1.4.1",
    "scikit-learn==1.2.0",
    "scikit-learn-extra==0.3.0",
    "scipy>=1.10",
    "sqlalchemy>=2.0",
    "stumpy>=1.13.0",
    "timeeval>=1.2.10",
    "timeeval-gutentag>=1.3",
    "tqdm>=4.64",
]

[tool.uv]
package = false

[tool.uv.sources]
easytsad = { path = "../..", editable = true }
