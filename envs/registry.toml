# Environment registry: the single source of truth for which environment
# runs which method. Each method must appear in exactly one environment.
#
# After editing this file run `scripts/tsad doc` to regenerate
# envs/ENVIRONMENTS.md, and `scripts/tsad check <env>` to verify imports.

[envs.torch2]
python = "3.11"
description = "Default. PyTorch 2.6 + CUDA 12.4, lightning, transformers, sklearn."
methods = [
    "AE", "AR", "AnomalyTransformer", "CAD", "CrossAD", "DCdetector", "DIFR", "Diff", "Donut",
    "EncDecAD", "Example", "FCVAE", "FITS", "LOF", "LSTMADalpha", "LSTMADbeta",
    "OCSVM", "OFA", "SRCNN", "SubLOF", "SubOCSVM", "TFAD", "TimesNet", "TranAD",
]

[envs.legacy]
python = "3.9"
description = "Old libraries: tslearn 0.5.x (Cython build), matrixprofile, numpy<1.24."
methods = ["SAND", "MatrixProfile"]

# Free-form notes shown in ENVIRONMENTS.md (known issues, caveats).

[envs.method_HYDRA]
project = "EasyTSAD/Methods/HYDRA/environment"
python = "==3.11.*"
description = "Method-local UV environment for HYDRA"
methods = ["HYDRA"]

[envs.method_CANDI]
project = "EasyTSAD/Methods/CANDI/environment"
python = "==3.11.*"
description = "Method-local UV environment for CANDI"
methods = ["CANDI"]

[envs.method_LatentFlow]
project = "EasyTSAD/Methods/LatentFlow/environment"
python = "==3.11.*"
description = "Method-local UV environment for LatentFlow"
methods = ["LatentFlow"]
[notes]
FCVAE = "Broken upstream: SyntaxError at EasyTSAD/Methods/FCVAE/TSDataset.py:46."
Example = "Template method, not a real baseline."
SAND = "Uses tslearn 0.5.x instead of the original 0.4.1 pin (0.4.1 needs scikit-learn<0.24, which has no Python 3.9 wheels); model.py imports cycc from either location."
Spot = "Helper module (SPOT/biSPOT/...), not a BaseMethod; not registered."

[envs.harness]
python = "3.11"
description = "Tooling env for the reproduction harness (DSH runtime, MCP tools, paper ingestion). Runs no methods."
methods = []

[envs.autotsad]
python = "3.9"
description = "AutoTSAD official deps (numpy<1.24, pandas<2, scikit-learn==1.2.0, optuna, timeeval, stumpy, pyod, pywavelets, pythresh, networkx, pynisher)."
methods = ["AutoTSAD"]
