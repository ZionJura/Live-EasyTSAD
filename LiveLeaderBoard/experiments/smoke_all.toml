methods = ["AnomalyTransformer", "DCdetector", "Diff", "EncDecAD", "FCVAE", "FITS", "LOF",
           "LSTMADbeta", "OCSVM", "OFA", "SRCNN", "TFAD", "TimesNet", "TranAD",
           "SAND", "MatrixProfile"]
evals = ["point_f1", "event_f1", "auprc"]
seed = 2026
