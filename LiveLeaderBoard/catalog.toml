# Display metadata used by `scripts/tsad export` to build
# LiveLeaderBoard/results/benchmark.json for the leaderboard web app.
#
# `family` must be one of the values accepted by leaderboard/src/data.ts:
#   "深度学习" (deep learning), "传统方法" (classic), "预训练模型" (pre-trained)
# Methods or datasets missing here are exported with neutral defaults.

